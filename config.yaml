# ---------- 数据源开关（探测结论 2026-08） ----------
sources:
  dblp: true            # ✅ 稳定，主数据源（会议全列表）
  arxiv: true           # ✅ 稳定，摘要 + 日报线主源
  semantic_scholar: true # ⚠️ 免费限流，带缓存+退避重试，仅用于引用数
  openreview: try       # ⚠️ 2026-08 起有 challenge 验证，能过则抓机构
