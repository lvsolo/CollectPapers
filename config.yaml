# =====================================================================
# CollectPapers 配置文件
# 增删领域、改关键词、调论文数量都在这里改，改完直接提交即可生效。
# =====================================================================

# ---------- 通用 ----------
github_repo: lvsolo/CollectPapers   # 推送目标仓库（仅作展示用途）

# 顶会 Guideline 线：默认从 2020 年开始收录（含奠基性论文）
# 日报线：arXiv 每日新论文
start_year: 2020
end_year: 2026

# ---------- 领域定义 ----------
# name:        显示名（中文备注写在 description）
# keywords:    匹配标题+摘要的关键词（不区分大小写）
# must_any:    正则，标题里命中才收录（收紧用，可省略）
# exclude:     排除关键词（如 tracking 领域排除 particle filter 等）
# weight:      命中该领域时的重要性加权
topics:
  - name: 3D Detection
    slug: 3d-detection
    description: 3D 目标检测（LiDAR / 相机 / 多模态融合）
    weight: 1.2
    keywords:
      - 3d object detection
      - 3d detection
      - lidar detection
      - point cloud detection
      - monocular 3d
      - stereo 3d detection
      - 3d pedestrian
      - waymo open dataset
      - nuscenes detection
      - object detection in point clouds
      - frustum pointnet
      - centerpoint
      - voxel
      - pillar
      - 3d bounding box
      - object detection for autonomous driving
      - camera-based 3d detection
    must_any: '\b(3d|three[- ]dimensional|lidar|point cloud|point-cloud)\b'
    exclude:
      - text detection
      - anomaly detection
      - fraud detection
      - spam detection
      - face detection
      - deepfake detection

  - name: BEV
    slug: bev
    description: 鸟瞰图感知（BEV 特征、BEV 检测/分割/预测）
    weight: 1.2
    keywords:
      - bird's eye view
      - birds eye view
      - bird's-eye view
      - bev
      - bev perception
      - lift splat shoot
      - bevdet
      - bevfusion
      - bevformer
      - surround-view
    must_any: '\b(bev|bird.?s?.eye.view|surround.view)\b'
    exclude:
      - battery electric vehicle
      - bev beverage

  - name: Occupancy
    slug: occupancy
    description: 占用栅格 / 占用网络（Occupancy Prediction / Occ3D）
    weight: 1.1
    keywords:
      - occupancy prediction
      - occupancy grid
      - occupancy network
      - occupancy field
      - semantic occupancy
      - 3d occupancy
      - voxel occupancy
      - occupancy perception
      - scene occupancy
    must_any: '\boccupanc(y|ies)\b'

  - name: Multi-camera Perception
    slug: multi-camera-perception
    description: 多相机 / 多视角感知（环视、深度估计与 3D 预测）
    weight: 1.0
    keywords:
      - multi-camera
      - multicamera
      - multi-view
      - multiview
      - surround view
      - camera-based perception
      - camera-only 3d
      - vision-centric
      - multi-view 3d
      - monocular depth estimation
      - self-supervised depth
      - surround-view fisheye
    exclude:
      - multi-view stereo reconstruction benchmark only

  - name: Tracking
    slug: tracking
    description: 目标跟踪（MOT / 3D 跟踪 / 多目标多相机跟踪）
    weight: 1.0
    keywords:
      - multi-object tracking
      - multiple object tracking
      - 3d tracking
      - multi-target tracking
      - point cloud tracking
      - mot challenge
      - joint detection and tracking
      - tracklet
      - visual tracking
      - single object tracking
      - pose tracking
      - tracking-by-attention
    must_any: '\btrack(ing|er|let)s?\b'
    exclude:
      - eye tracking
      - gaze tracking
      - camera tracking shot
      - tracking shot film

  - name: Open Vocabulary Detection
    slug: open-vocabulary-detection
    description: 开放词表检测 / 开放世界感知（OVD / OWOD）
    weight: 1.1
    keywords:
      - open vocabulary
      - open-vocabulary
      - open world detection
      - open-world object detection
      - zero-shot detection
      - novel class discovery
      - category-agnostic
      - open-set detection
      - open category
      - grounded open-vocabulary
    must_any: '\bopen[ -](vocab|world|set|category|class)'
    exclude:
      - open vocabulary nlp only

  - name: FOD Detection
    slug: fod-detection
    description: 异物检测（Foreign Object Debris，机场跑道/铁路 FOD）
    weight: 0.9
    keywords:
      - foreign object debris
      - fod detection
      - foreign object detection
      - runway inspection
      - railway intrusion detection
      - surface anomaly foreign
    must_any: '\b(fod|foreign object)\b'

  - name: VLM
    slug: vlm
    description: 视觉语言模型（多模态大模型、CLIP 系、grounding）
    weight: 1.1
    keywords:
      - vision-language model
      - vision-language models
      - vision language model
      - vision-language pretraining
      - vision-language foundation
      - multimodal large language model
      - multimodal llm
      - large vision-language
      - large vision language
      - vlm
      - clip
      - contrastive language-image
      - grounded vision language
      - visual grounding
      - referring expression
      - blip
      - llava
      - vision-language navigation
      - image-text
      - text-to-image grounding
      - visual instruction tuning
    must_any: '\b(vlm|vision.language|multimodal|multi.modal|cross.modal|visual grounding|referring|language.image|image.text|clip)\b'
    exclude:
      - speech-only
      - audio-only

  - name: Vision Transformer
    slug: vision-transformer
    description: 视觉 Transformer（ViT、混合架构、高效注意力）
    weight: 1.0
    keywords:
      - vision transformer
      - vit
      - swin
      - pyramid vision transformer
      - hierarchical transformer
      - patch embedding
      - image transformer
      - transformer for image recognition
      - attention in vision
      - efficient attention image
      - deit
      - window attention
      - token merging
    must_any: '\b(vit|vision transformer|visual transformer|swin|deit)\b'
    exclude:
      - vitis
      - digital

  - name: Self-supervised Vision
    slug: self-supervised-vision
    description: 视觉自监督学习（对比学习、MAE、DINO 系）
    weight: 1.0
    keywords:
      - self-supervised learning
      - self-supervised representation
      - self-supervised
      - contrastive learning
      - masked image modeling
      - masked image
      - mask latent modeling
      - masked autoencoder
      - mae
      - dino
      - byol
      - moco
      - simclr
      - unsupervised pretraining vision
      - pretext task
      - joint-embedding predictive
      - jepa
      - latent prediction
      - masked modeling
      - self-supervised video
      - representation learning without labels
    must_any: '\b(self.supervised|contrastive|masked (image|autoencoder|visual)|byol|moco|simclr|dino|mae)\b'
    exclude:
      - nlp only bert

  - name: Video Understanding
    slug: video-understanding
    description: 视频理解（动作识别、时序动作、视频大模型）
    weight: 1.0
    keywords:
      - video understanding
      - action recognition
      - temporal action
      - video representation
      - video recognition
      - video-language
      - video large language model
      - video retrieval
      - video question answering
      - spatio-temporal
      - video segmentation
      - video anomaly
      - egocentric video
      - long video understanding
    must_any: '\bvideo\b'
    exclude:
      - video conferencing
      - video streaming qos
      - video codec only

  - name: Multimodal
    slug: multimodal
    description: 多模态学习（图文对齐、融合、多模态融合感知）
    weight: 1.0
    keywords:
      - multimodal
      - multi-modal
      - cross-modal
      - visual question answering
      - image-text matching
      - image-text pretraining
      - vision and language fusion
      - audio-visual
      - multimodal fusion
      - anymodal
      - image captioning
      - text-image retrieval
    must_any: '\b(multi.?modal|cross.modal|audio.visual)\b'
    exclude:
      - multimodal biometric only

  - name: Continual Learning
    slug: continual-learning
    description: 持续学习 / 增量学习（含 VLM/多模态场景）
    weight: 1.0
    keywords:
      - continual learning
      - continuous learning
      - incremental learning
      - lifelong learning
      - class-incremental
      - task-incremental
      - catastrophic forgetting
      - rehearsal buffer
      - domain-incremental
      - online continual
      - prompt-based continual
    must_any: '\b(continual|incremental|lifelong)\b'
    exclude:
      - incremental optical flow only

  - name: Neural Architecture Search
    slug: neural-architecture-search
    description: 神经架构搜索（NAS、Zero-Cost、搜索空间）
    weight: 0.9
    keywords:
      - neural architecture search
      - architecture search
      - nas
      - nas-bench
      - zero-cost proxy
      - differentiable architecture
      - darts
      - supernet
      - hardware-aware nas
      - efficient architecture design
    must_any: '\b(nas|architecture search|darts|supernet)\b'
    exclude:
      - nas gateway network routing

  - name: Network Pruning
    slug: network-pruning
    description: 网络剪枝 / 模型压缩（结构化剪枝、稀疏化）
    weight: 0.9
    keywords:
      - network pruning
      - model pruning
      - prune
      - prunes
      - pruning
      - pruned
      - structured pruning
      - sparsity
      - sparse training
      - lottery ticket
      - channel pruning
      - filter pruning
      - compression
      - weight sparsification
    must_any: '\b(prun\w*|spars\w*|lottery ticket|compress\w*)\b'
    exclude:
      - pruning fruit tree

  - name: Knowledge Distillation
    slug: knowledge-distillation
    description: 知识蒸馏（特征/逻辑蒸馏、VLM 蒸馏、自蒸馏）
    weight: 0.9
    keywords:
      - knowledge distillation
      - distillation
      - teacher-student
      - teacher student
      - self-distillation
      - feature imitation
      - distilling
      - hint learning
      - feature distillation
    must_any: '\b(distill|teacher.student)\b'

# ---------- 顶会 Guideline 线 ----------
conferences:
  # DBLP venue 名（查询参数用）
  # announce_month: 当年录用结果开始公示的月份。
  # 语义：当前月份 < announce_month → 该会议"当年"尚未公布，跳过抓取（DBLP 上也还没有数据）；
  #       已到/已过公示月 → 当年数据照常抓（如 8 月的 CVPR 2026 已公布完毕，就是常规数据）。
  # 历史年份永远全量（数据稳定，走缓存）。
  - name: CVPR
    dblp_venue: CVPR
    announce_month: 2       # 2月公示，6月开会
  - name: ECCV
    dblp_venue: ECCV
    announce_month: 7       # 7月公示，10月开会；仅偶数年举办
    even_years_only: true
  - name: ICCV
    dblp_venue: ICCV
    announce_month: 8       # 8月公示，10月开会；仅奇数年举办
    odd_years_only: true
  - name: NeurIPS
    dblp_venue: NeurIPS
    announce_month: 9       # 9月公示，12月开会
  - name: ICLR
    dblp_venue: ICLR
    announce_month: 1       # 1月公示（前一年投稿），4-5月开会
  - name: ICML
    dblp_venue: ICML
    announce_month: 5       # 5月公示，7月开会

# 顶会线的分年份上限：早年份领域内论文太多时防止文件爆炸
max_papers_per_year: 120          # 排序后取前 N 篇写入 Guideline
max_papers_per_year_before_2022: 60  # 2020/2021 只留最重要的

# ---------- 日报线（arXiv daily） ----------
daily:
  categories: [cs.CV]              # 主抓取类目
  lookback_days: 3                 # 抓最近 3 天提交（覆盖周末空窗）
  max_papers_per_topic: 10         # 每个领域日报最多展示条数
  max_total: 120                   # 每日总量上限（控制 LLM 花费；无 LLM 时不受限于此值的评估成本）
  report_dir: daily                # 报告存放目录

# ---------- LLM 评估（可选，无 Key 自动降级） ----------
llm:
  enabled: true                    # 有 Key 才真正调用
  # 兼容 OpenAI 接口。GitHub Secrets: LLM_API_BASE / LLM_API_KEY / LLM_MODEL
  api_base_env: LLM_API_BASE
  api_key_env: LLM_API_KEY
  model_env: LLM_MODEL
  default_base: https://api.deepseek.com/v1   # 未设 env 时的兜底
  default_model: deepseek-chat
  temperature: 0.2
  max_papers_per_call: 6           # 单次评估的论文数（控制单条 prompt 长度）
  timeout: 120
  guideline_eval_topn: 25          # 顶会线每个领域每年只评前 N 篇（成本控制）

