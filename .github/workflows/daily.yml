name: Daily arXiv Report

on:
  schedule:
    # 北京时间凌晨 02:23（= 前一天 UTC 18:23）跑，早起即见昨日最新论文
    # 注：GitHub cron 用 UTC；选非整点分钟避开高峰延迟
    - cron: "23 18 * * *"
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

concurrency:
  group: daily-arxiv
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Restore LLM eval cache
        uses: actions/cache@v4
        with:
          path: .cache/llm_evals.json
          key: llm-evals-${{ github.run_id }}
          restore-keys: |
            llm-evals-

      - name: Run daily collector
        env:
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python3 daily_arxiv.py --days 3

      - name: Update README recent list
        run: python3 update_readme.py

      - name: Commit and push
        run: |
          git config user.name "collectpapers-bot"
          git config user.email "actions@github.com"
          git add daily/ README.md .cache/daily_seen.json
          # 无变化就不提交（避免空提交堆积）
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "docs(daily): arXiv report $(date -u +%F)"
            # 远端可能同时有新提交（人工/另一 workflow），rebase 后再推
            git pull --rebase origin main
            git push
          fi
