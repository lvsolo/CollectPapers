name: Conference Guidelines Update

on:
  schedule:
    # 每两天跑一次（北京时间凌晨 02:41 = 前一天 UTC 18:41，与日报错开）
    - cron: "41 18 */2 * *"
  workflow_dispatch:
    inputs:
      conference:
        description: "只跑某个会议（留空 = 全部）"
        required: false
        default: ""
      year:
        description: "只跑某年（留空 = 全部年份）"
        required: false
        default: ""
      force:
        description: "强制重跑已成功批次（默认跳过 .cache/batches 里已有的）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  # 单会议手动重跑（带参数）与全量 run 分组：互不取消
  # 全量 run 共享一组排队；单点重跑各自独立组并行执行
  group: conference-guidelines-${{ github.event.inputs.conference != '' && 'single' || 'full' }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # 阶段 1: 决定本次要跑哪些 (会议, 年份) 组合（应用公布窗口过滤）
  # ------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.setmatrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml
      - id: setmatrix
        run: |
          python3 - <<'EOF' > matrix.json
          import json, datetime as dt, sys, yaml
          from pathlib import Path
          sys.path.insert(0, '.')
          cfg = yaml.safe_load(open('config.yaml'))
          conf_arg = '${{ github.event.inputs.conference }}'.strip()
          year_arg = '${{ github.event.inputs.year }}'.strip()
          force_rerun = '${{ github.event.inputs.force }}'.strip() == 'true'
          start, end = cfg['start_year'], cfg['end_year']
          now = dt.date.today()
          # 已成功批次凭证：git 里存在的 batch 文件（含完整 enrich 数据即视为成功）
          done = {p.stem for p in Path('.cache/batches').glob('*.json')} if Path('.cache/batches').exists() else set()
          combos, skipped = [], []
          for c in cfg['conferences']:
              if conf_arg and c['name'].lower() != conf_arg.lower():
                  continue
              for y in range(start, end + 1):
                  if year_arg and str(y) != year_arg:
                      continue
                  if y == now.year:  # 当年按公布状态过滤
                      if c.get('even_years_only') and y % 2 != 0: continue
                      if c.get('odd_years_only') and y % 2 != 1: continue
                      am = c.get('announce_month')
                      if am and now.month < am: continue
                  key = f"{c['dblp_venue']}-{y}"
                  if key in done and not force_rerun:
                      skipped.append(key)  # 已成功：不重跑（增量调度核心）
                      continue
                  combos.append({'conference': c['dblp_venue'], 'year': y})
          print(json.dumps({'include': combos}))
          print(f"PLANNED {len(combos)} | SKIPPED(done) {len(skipped)}: {', '.join(sorted(skipped))}", file=sys.stderr)
          EOF
          m=$(cat matrix.json | jq -c .)
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          cat matrix.json | head -c 400

  # ------------------------------------------------------------------
  # 阶段 2: 每个组合一个独立 job（分批，互不影响）
  # ------------------------------------------------------------------
  collect:
    needs: plan
    runs-on: ubuntu-latest
    # 大会议批次（CVPR 大年份 2000+ 篇）DBLP 扫描+enrich 需要 40-70 分钟
    timeout-minutes: 90
    # 单批超时只杀自己（fail-fast 已关）；串行模式下每批独立运行互不影响
    strategy:
      fail-fast: false           # 一个格子失败不拖垮其他格子
      max-parallel: 1            # 串行执行：DBLP 限流（429）+ git 并发 push 冲突 双重根治
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: .cache
          key: collectpapers-v3-${{ matrix.conference }}-${{ matrix.year }}-${{ github.run_id }}
          restore-keys: |
            collectpapers-v3-${{ matrix.conference }}-${{ matrix.year }}-
            collectpapers-v3-

      - name: Run collector for this conference-year
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: |
          python3 collect.py --conference ${{ matrix.conference }} --year ${{ matrix.year }} --no-llm

      - name: Commit this batch (regenerate-over strategy)
        run: |
          git config user.name "collectpapers-bot"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            git add topics/ .cache/ 2>/dev/null
            if git diff --cached --quiet; then
              echo "No changes for ${{ matrix.conference }} ${{ matrix.year }}"
              exit 0
            fi
            git commit -m "docs(topics): ${{ matrix.conference }} ${{ matrix.year }} refresh"
            # 关键：Guideline 是整文件再生成物，直接覆盖而非 merge。
            # 先 fetch，再以 ours 策略合并远端（保留本批重生成版本，其余取远端），
            # 从根本上避开内容 rebase 冲突。
            git fetch origin main
            if git merge -s recursive -X theirs FETCH_HEAD -m "merge: take regenerated ${{ matrix.conference }} ${{ matrix.year }}"; then
              :
            else
              # 兜底：任何残留冲突文件一律取本批版本（工作区即本批最新产物）
              git checkout --ours . 2>/dev/null || true
              git add -A 2>/dev/null || true
              git commit --no-edit 2>/dev/null || true
            fi
            if git push; then
              echo "pushed batch ${{ matrix.conference }} ${{ matrix.year }}"
              exit 0
            fi
            echo "push rejected, retry $i/5 after backoff"
            sleep $((i * 20))
            git reset --soft HEAD~1 2>/dev/null || true
          done
          echo "::error::batch ${{ matrix.conference }} ${{ matrix.year }} could not push after 5 tries"
          exit 1

  # ------------------------------------------------------------------
  # 阶段 3: LLM 评估（单独阶段，逐领域小批次，读上一阶段落盘的数据）
  # ------------------------------------------------------------------
  llm-eval:
    needs: [plan, collect]
    # 无论 collect 成败都跑：batches 在 git 里（已成功批次的数据完整），
    # LLM 摘要按 batch 增量补全，失败批次的摘要等该批次补跑成功后下一轮自然补上
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # 拿到 collect 阶段推上去的最新 topics 和缓存

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Restore full cache (batches + LLM evals)
        uses: actions/cache@v4
        with:
          path: .cache
          # 恢复整个 .cache：llm_evals.json + collect 阶段落盘的 batches/*.json
          # （restore-keys 前缀匹配会拿到最近的 collectpapers-v3-* 缓存）
          key: llm-stage-${{ github.run_id }}
          restore-keys: |
            llm-stage-
            collectpapers-v3-

      - name: Run LLM evaluation over collected buckets
        env:
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          # 从缓存里恢复完整 bucket 太重；改为直接重算（DBLP 全走 HTTP 缓存，很快），
          # 再跑 LLM。此阶段 DBLP 不产生新请求（72h 缓存），只花 LLM 的钱（增量缓存）。
          python3 collect.py --llm-only

      - name: Commit LLM summaries (regenerate-over)
        run: |
          git config user.name "collectpapers-bot"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            git add topics/ .cache/llm_evals.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No LLM changes"
              exit 0
            fi
            git commit -m "docs(topics): LLM 中英对照摘要 batch $(date -u +%F)"
            # 与批次相同的覆盖式合并（Guideline 是再生成物，不 rebase）
            git fetch origin main
            if git merge -s recursive -X theirs FETCH_HEAD -m "merge: take LLM-regenerated guidelines"; then
              :
            else
              git checkout --ours . 2>/dev/null || true
              git add -A 2>/dev/null || true
              git commit --no-edit 2>/dev/null || true
            fi
            if git push; then
              echo "pushed LLM summaries"
              exit 0
            fi
            echo "push rejected, retry $i/5"
            sleep $((i * 20))
            git reset --soft HEAD~1 2>/dev/null || true
          done
          echo "::error::LLM summaries could not push after 5 tries"
          exit 1

  # ------------------------------------------------------------------
  # 阶段 4: 汇总 README 索引
  # ------------------------------------------------------------------
  finalize:
    needs: [plan, collect, llm-eval]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml
      - name: Update README index
        run: python3 update_readme.py
      - name: Commit
        run: |
          git config user.name "collectpapers-bot"
          git config user.email "actions@github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "docs: refresh README index" && git pull --rebase origin main && git push)
